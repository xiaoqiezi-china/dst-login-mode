plugins {
    id 'java'
}

group = 'dev.dstmode'
version = mod_version

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.ow2.asm:asm:${asm_version}"
}

java {
    // 1.16 及以下的客户端普遍跑 Java 8，agent 必须兼容到 8
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

// fat jar：把 ASM 一并打进去，agent 必须自包含
jar {
    archiveBaseName = 'dstmode-agent'
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    manifest {
        attributes(
            'Premain-Class': 'dev.dstmode.agent.DstAgent',
            'Agent-Class': 'dev.dstmode.agent.DstAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'Implementation-Title': 'DST-Mode Agent',
            'Implementation-Version': mod_version
        )
    }
}
// ASM 必须重定位，否则与 Minecraft 自带的 ASM 在 classpath 上重复，Fabric 会直接拒绝启动
tasks.register('relocateAsm', JavaExec) {
    dependsOn tasks.named('jar')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.dstmode.agent.tool.Relocate'
    args tasks.jar.archiveFile.get().asFile.absolutePath
}

tasks.named('assemble') {
    dependsOn 'relocateAsm'
}
