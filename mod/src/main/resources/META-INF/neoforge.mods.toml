[[mods]]
modId="dstmode"
version="1.0.0"
displayName="帝释天模式"
authors="帝释天"
description='''
帝释天模式（DST-Mode）：一个 jar 同时用于客户端与服务端。

客户端：由启动器通过 -Ddstmode.authBase=<url> 传入签发服务器地址后，
把登录与材质拉取指向该服务器；未传入时保持惰性，等同于未安装。

服务端：把登录校验（hasJoined）指向同一个签发服务器，
由该服务完成「本地 QQ 票据优先、未命中转发 Mojang」的双源校验，
从而让正版玩家与非正版玩家共用同一台服务器。
'''

[[mixins]]
config="dstmode.mixins.json"

[[dependencies.dstmode]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.dstmode]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"
